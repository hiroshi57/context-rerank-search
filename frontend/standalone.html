<body><div style="max-width:880px;margin:0 auto 4px;background:#fff8e1;border:1px solid #f0d98a;border-radius:10px;padding:8px 14px;font:13px system-ui;color:#7a5b00">🔬 <b>実検索版</b>：入力した質問に対し、<b>ブラウザ内で実際に検索（BM25風スコア＋同義語展開＋再ランキング）</b>を実行します。文書は編集可能で、追加すればその場で検索対象になります。</div>

<script type="text/plain" id="__jsx">
const DOCS0=`### 契約書（SaaS利用規約）
本サービスの解約は、解約希望日の30日前までに書面またはメールで通知するものとする。解約時の返金は行わない。
### 業務委託契約書
本契約の中途解約は、1ヶ月前の予告をもって可能とする。予告なき中途解約の場合は違約金が発生する。
### 就業規則（休職）
私傷病により継続して30日以上勤務できない場合、休職を命ずることがある。休職期間は最大6ヶ月とする。
### 個人情報取扱規程
個人データの第三者提供は原則禁止。委託先への提供は契約締結と監督を条件に認める。秘密情報の漏洩時は直ちに報告する。
### 発注・支払規程
請求書は月末締め翌月末払い。支払遅延の場合は年14.6%の遅延損害金を申し受ける。
### 秘密保持契約(NDA)
開示された秘密情報は契約終了後3年間、第三者へ開示してはならない。`;

const SYN={"キャンセル":["解約","中途解約","解除"],"解約":["キャンセル","中途解約","解除"],
  "やめたい":["解約","中途解約","退会"],"退会":["解約"],"辞める":["解約","退職"],
  "支払い":["支払","請求","入金"],"遅れ":["遅延","延滞","遅滞"],"遅延":["遅れ","延滞"],
  "漏洩":["秘密情報","個人情報","開示"],"休み":["休職","休暇"],"病気":["私傷病","傷病"],
  "違約金":["損害金"],"期限":["締切","期日","予告"]};
// 助詞・機能語（これらを含む2-gramはノイズなので除外する）
const PARTICLE=["の","を","に","は","が","で","と","も","へ","や","か","ば","ね","よ","し","て","た","な","だ","ど","ら","れ","る","い","う","ん","ま","す"];
const STOPGRAM=["です","ます","たい","する","した","こと","ため","場合","どう","なる","たら","ある","いる","これ","それ"];
function isNoise(g){
  if(STOPGRAM.includes(g))return true;
  // 2文字とも「ひらがなの機能語」なら意味を持たないノイズと判定
  const a=g[0],b=g[1];
  const hira=c=>/[ぁ-ん]/.test(c);
  if(hira(a)&&hira(b)&&(PARTICLE.includes(a)||PARTICLE.includes(b)))return true;
  return false;
}
function tokenize(s){
  const t=[];
  const jp=(s||"").replace(/[^぀-ヿ一-龯ａ-ｚA-Za-z0-9]/g,"");
  for(let i=0;i<jp.length-1;i++){const g=jp.substr(i,2); if(!isNoise(g))t.push(g);}
  return t;
}
function parseDocs(text){
  const parts=text.split(/^###\s*/m).map(s=>s.trim()).filter(Boolean);
  return parts.map((p,i)=>{const nl=p.indexOf("\n");
    const title=nl>0?p.slice(0,nl).trim():p.slice(0,20);
    const body=nl>0?p.slice(nl+1).trim():"";
    return {id:"D"+(i+1), title, body, text:title+" "+body};});
}
function expandTerms(q){
  const out=[];
  Object.keys(SYN).forEach(k=>{ if(q.includes(k)) SYN[k].forEach(s=>out.push(s)); });
  return out;
}
function lexScore(doc,qTokens,docs,cache){
  const dt=cache.get(doc.id);
  const len=dt.length||1;
  let avg=0; docs.forEach(d=>{avg+=cache.get(d.id).length;}); avg=avg/(docs.length||1)||1;
  const k1=1.5,b=0.75; let s=0;
  [...new Set(qTokens)].forEach(t=>{
    const tf=dt.filter(x=>x===t).length; if(!tf)return;
    const df=docs.filter(d=>cache.get(d.id).includes(t)).length||1;
    const idf=Math.log(1+(docs.length-df+0.5)/(df+0.5));
    s+=idf*(tf*(k1+1))/(tf+k1*(1-b+b*len/avg));
  });
  return s;
}
function search(query,docs){
  const cache=new Map(); docs.forEach(d=>cache.set(d.id,tokenize(d.text)));
  const baseTokens=tokenize(query);
  const synWords=expandTerms(query);
  const allTokens=[...baseTokens,...synWords.flatMap(w=>tokenize(w))];
  return docs.map(d=>{
    const vec=lexScore(d,baseTokens,docs,cache);
    const rer=lexScore(d,allTokens,docs,cache);
    const reasons=[];
    Object.keys(SYN).forEach(k=>{
      if(query.includes(k)) SYN[k].forEach(s=>{ if(d.text.includes(s)) reasons.push("同義概念で一致（"+k+"→"+s+"）"); });
    });
    [...new Set(baseTokens)].forEach(t=>{ if(d.text.includes(t) && reasons.length<3) reasons.push("語「"+t+"」が一致"); });
    return {...d, vec:Math.round(vec*100)/100, rer:Math.round(rer*100)/100, reasons:[...new Set(reasons)].slice(0,3)};
  });
}
function snippet(body,query){
  const terms=[...new Set([...tokenize(query),...expandTerms(query)])].filter(t=>t.length>=2);
  let idx=-1;
  for(const t of terms){ const i=body.indexOf(t); if(i>=0){idx=i;break;} }
  const start=idx<0?0:Math.max(0,idx-40), end=Math.min(body.length,(idx<0?120:idx+110));
  return {text:body.slice(start,end), pre:start>0, post:end<body.length, terms};
}
function Highlight({text,terms}){
  const ts=terms.filter(t=>t.length>=2);
  if(!ts.length)return <span>{text}</span>;
  const re=new RegExp("("+ts.map(t=>t.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).join("|")+")","g");
  const parts=text.split(re);
  return <span>{parts.map((p,i)=>ts.includes(p)?<mark key={i}>{p}</mark>:<span key={i}>{p}</span>)}</span>;
}


// ===== 自動保存 & データ書き出し/読み込み（入力内容がリロードで消えないようにする） =====
const STORE="rerank_v1";
function usePersist(name,initial){
  const [v,setV]=React.useState(function(){
    try{var s=localStorage.getItem(STORE+":"+name);return s?JSON.parse(s):initial;}catch(e){return initial;}
  });
  React.useEffect(function(){
    try{localStorage.setItem(STORE+":"+name,JSON.stringify(v));}catch(e){}
  },[name,v]);
  return [v,setV];
}
function collectAll(){
  var o={};
  for(var i=0;i<localStorage.length;i++){
    var k=localStorage.key(i);
    if(k&&k.indexOf(STORE+":")===0){try{o[k.slice(STORE.length+1)]=JSON.parse(localStorage.getItem(k));}catch(e){}}
  }
  return o;
}
function DataBar(){
  const [msg,setMsg]=React.useState("");
  const fileRef=React.useRef(null);
  const save=function(){
    try{
      var data={_tool:STORE,_savedAt:new Date().toISOString(),data:collectAll()};
      var blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
      var a=document.createElement("a");
      a.href=URL.createObjectURL(blob);
      a.download=STORE+"_"+new Date().toISOString().slice(0,10)+".json";
      a.click();URL.revokeObjectURL(a.href);
      setMsg("書き出しました");setTimeout(function(){setMsg("");},2500);
    }catch(e){setMsg("書き出しに失敗しました");}
  };
  const load=function(e){
    var f=e.target.files&&e.target.files[0]; if(!f)return;
    var rd=new FileReader();
    rd.onload=function(){
      try{
        var j=JSON.parse(rd.result);
        if(!j||!j.data)throw new Error("形式が違います");
        if(j._tool&&j._tool!==STORE){ if(!confirm("別のツールのファイルのようです。読み込みますか？"))return; }
        Object.keys(j.data).forEach(function(k){localStorage.setItem(STORE+":"+k,JSON.stringify(j.data[k]));});
        location.reload();
      }catch(err){setMsg("読み込めませんでした（"+err.message+"）");}
    };
    rd.readAsText(f);
  };
  const clear=function(){
    if(!confirm("入力した内容をすべて消して、最初の状態に戻します。よろしいですか？"))return;
    var del=[];
    for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);if(k&&k.indexOf(STORE+":")===0)del.push(k);}
    del.forEach(function(k){localStorage.removeItem(k);});
    location.reload();
  };
  return (<div style={{background:"#f2f7f4",border:"1px solid #cfe3d8",borderRadius:10,padding:"9px 12px",
      margin:"0 0 12px",fontSize:13,display:"flex",gap:8,alignItems:"center",flexWrap:"wrap",color:"#0f5c3f"}}>
    <span>💾 <b>入力した内容はこの端末に自動保存されます</b>（閉じても消えません）</span>
    <span style={{flex:1}}></span>
    <button onClick={save} style={{border:0,borderRadius:7,background:"#17a673",color:"#fff",padding:"6px 11px",cursor:"pointer",fontSize:12.5}}>データを書き出す</button>
    <button onClick={function(){fileRef.current&&fileRef.current.click();}} style={{border:0,borderRadius:7,background:"#e7f0eb",color:"#0f5c3f",padding:"6px 11px",cursor:"pointer",fontSize:12.5}}>読み込む</button>
    <button onClick={clear} style={{border:0,borderRadius:7,background:"#f7e4e4",color:"#c0392b",padding:"6px 11px",cursor:"pointer",fontSize:12.5}}>最初に戻す</button>
    <input ref={fileRef} type="file" accept="application/json" onChange={load} style={{display:"none"}}/>
    {msg && <span style={{color:"#0f5c3f",fontWeight:"bold"}}>{msg}</span>}
  </div>);
}

function App(){
  const [raw,setRaw]=usePersist("raw",DOCS0);
  const [q,setQ]=usePersist("q","契約をキャンセルしたい");
  const [showDocs,setShowDocs]=React.useState(false);
  const docs=parseDocs(raw);
  const scored=search(q,docs);
  const byVec=[...scored].sort((a,b)=>b.vec-a.vec);
  const byRer=[...scored].sort((a,b)=>b.rer-a.rer);
  // 最低適合度の閾値: 最高スコアの25%未満、かつ絶対値2.0未満は「無関係なノイズ」として除外
  const top=Math.max(0,...byRer.map(d=>d.rer));
  const MIN=2.0;
  const hits=byRer.filter(d=>d.rer>=MIN && d.rer>=top*0.25);
  const maxRer=Math.max(0.01,...byRer.map(d=>d.rer));
  const moved=byRer.map((d,i)=>({id:d.id,to:i,from:byVec.findIndex(x=>x.id===d.id)}));
  const promoted=moved.filter(m=>m.from>m.to);
  const EX=["契約をキャンセルしたい","支払いが遅れたらどうなる","病気で長く休みたい","情報の漏洩が心配","違約金の期限"];

  return (<div className="wrap"><DataBar/>
    <h1>言い換え対応 社内文書検索 <span className="sub">「解約」と書かれた規程を「キャンセル」で探せるようにする</span></h1>

    <div className="card" style={{background:"#fcfbff"}}>
      <h2>何のための道具？（1分で分かる説明）</h2>
      <div className="usecase">
        <div className="prob"><b>❌ ふつうの検索で困ること</b><br/>
          社内の規程には「<b>解約</b>」と書いてある。でも社員は「契約を<b>キャンセル</b>したい」と検索する。
          → <b>文字が違うのでヒットしない</b>。「そんな規程は無い」と誤解され、結果として総務や上司に同じ質問が何度も来る。</div>
        <div className="sol"><b>✅ このツールがすること</b><br/>
          「キャンセル＝解約」のような<b>意味のつながり</b>を辞書に持ち、言い換えても正しい文書を見つけます。
          さらに<b>なぜヒットしたか（根拠）</b>を表示するので、ユーザーが結果を信用できます。</div>
      </div>
      <h3>こんな人・場面で必要になります</h3>
      <ul className="who">
        <li><b>社内ヘルプデスク／総務・人事</b>：「規程に書いてあるのに見つけられない」という問い合わせが多い。検索の言い換え耐性を上げれば、問い合わせ自体が減ります。</li>
        <li><b>カスタマーサポート</b>：お客様は正式名称で聞いてくれません（「返品」を「返したい」）。オペレーターが該当規約をすぐ引ける必要があります。</li>
        <li><b>社内AIチャットを作る人（RAG開発者）</b>：AIチャットの回答精度は<b>ほぼ検索精度で決まります</b>。検索で正しい文書を拾えないと、AIは平気で間違った回答を作ります。ここは<b>AI回答の前段にある一番重要な部品</b>です。</li>
        <li><b>法務・契約管理</b>：契約書の山から「この論点はどの条項か」を探す。用語が契約ごとに違うため、言い換え対応が効きます。</li>
      </ul>
      <div className="sub" style={{marginTop:8}}>💡 <b>試し方</b>：下の入力欄に「契約をキャンセルしたい」と入れてください。文書には「キャンセル」の語は<b>1つもありません</b>が、「解約」の条項が正しく1位で出ます。それが<b>この道具の価値</b>です。</div>
    </div>

    <div className="card">
      <div className="real">🔍 <b>質問を自由に入力</b>してください。単語が一致しなくても同義概念（例：キャンセル→解約）に展開して検索し、<b>なぜヒットしたかの根拠</b>を表示します。</div>
      <div className="src">
        <b>📋 このデータの出所（正直に）</b>
        <div>・検索対象の{docs.length}件は<b>デモ用に作成した架空の社内規程</b>です（「検索対象の文書を編集」で全文を確認・差し替えできます）。</div>
        <div>・<b>スコアは実計算</b>です。ブラウザ内でBM25（検索の標準的な統計手法）を実行しており、順位をあらかじめ書いてはいません。</div>
        <div>・同義語辞書（{Object.keys(SYN).length}語）は<b>手作りの簡易版</b>です。実運用では自社の用語集や埋め込みベクトルを使います。</div>
      </div>
      <input className="q" value={q} onChange={e=>setQ(e.target.value)} placeholder="例: 契約をキャンセルしたい"/>
      <div className="chips">{EX.map((x,i)=>(<span className="chip" key={i} onClick={()=>setQ(x)}>{x}</span>))}</div>
      <button className="ghost" onClick={()=>setShowDocs(s=>!s)}>{showDocs?"文書を隠す":"検索対象の文書を編集（現在"+docs.length+"件）"}</button>
      {showDocs && <div style={{marginTop:8}}>
        <div className="sub">「### タイトル」で区切って自由に文書を追加できます（追加すると即検索対象）。</div>
        <textarea value={raw} onChange={e=>setRaw(e.target.value)}/>
      </div>}
    </div>

    {hits.length===0
      ? <div className="card"><div className="zero"><b>該当なし</b>：この質問に一致する文書がありません。存在しない回答を作らず「見つからない」と返します。文書を追加するか、言い換えてください。</div></div>
      : <div className="card">
          <h2>検索結果（再ランキング後・{hits.length}件）</h2>
          {hits.map((d,i)=>{const sn=snippet(d.body,q);const mv=moved.find(m=>m.id===d.id);
            return (<div className="hit" key={d.id}>
              <div className="ttl"><span className="rank">{i+1}</span>{d.title}
                {mv && mv.from>mv.to && <span className="moved up">▲ {mv.from+1}位→{mv.to+1}位に浮上</span>}
                {mv && mv.from<mv.to && <span className="moved down">▼ {mv.from+1}位→{mv.to+1}位</span>}
              </div>
              <div className="snip">{sn.pre?"…":""}<Highlight text={sn.text} terms={sn.terms}/>{sn.post?"…":""}</div>
              <div className="barrow"><span className="name">適合度</span>
                <div className="track"><div className="fill" style={{width:(d.rer/maxRer*100)+"%"}}></div></div>
                <span style={{width:44,textAlign:"right"}}>{d.rer}</span></div>
              <div className="reasons">✓ {d.reasons.length?d.reasons.join(" ／ "):"語彙一致"}</div>
            </div>);})}
        </div>}

    <div className="card">
      <h2>再ランキングの効果（同義語展開あり / なし）</h2>
      <p className="sub">「なし」＝入力語そのままで検索。「あり」＝同義概念に展開して検索。順位がどう変わったかを実測比較します。</p>
      <table><thead><tr><th className="l">文書</th><th>展開なし</th><th>順位</th><th>展開あり</th><th>順位</th><th>変化</th></tr></thead>
        <tbody>{byRer.map((d,i)=>{const from=byVec.findIndex(x=>x.id===d.id);
          return (<tr key={d.id}><td className="l">{d.title}</td><td>{d.vec}</td><td>{from+1}</td><td><b>{d.rer}</b></td><td><b>{i+1}</b></td>
            <td className={from>i?"up":from<i?"down":""}>{from>i?"▲+"+(from-i):from<i?"▼"+(i-from):"—"}</td></tr>);})}
        </tbody></table>
    </div>

    <div className="card">
      <h2>🤖 分析と精度を上げるプラン</h2>
      <div className="ai">
        この質問では <b>{promoted.length}件</b>の文書が同義語展開によって順位を上げました。
        {hits.length>0 && <span> 1位は「{hits[0].title}」（適合度{hits[0].rer}）。根拠は「{hits[0].reasons[0]||"語彙一致"}」です。</span>}
        {hits.length>1 && (hits[0].rer-hits[1].rer)<0.3 && <span> ただし2位との差が小さく（{(hits[0].rer-hits[1].rer).toFixed(2)}）、判断が拮抗しています。</span>}
      </div>
      <div className="plan">
        <div className="tierlabel">① まず改善する</div>
        <ul>
          {hits.length===0 && <li><b>ヒットゼロ</b>：この言い回しの同義語を辞書に追加する（現在{Object.keys(SYN).length}語）。</li>}
          {hits.length>1 && (hits[0].rer-hits[1].rer)<0.3 && <li><b>順位が拮抗</b>：文書タイトルを具体化し、判別できる語を含める。</li>}
          {docs.length<10 && <li><b>文書数が少ない</b>（{docs.length}件）：規程・FAQを追加登録すると精度が安定します。</li>}
          {promoted.length===0 && hits.length>0 && <li><b>同義語展開が効いていない</b>：この質問に関係する言い換えを辞書へ追加。</li>}
        </ul>
      </div>
      <div className="plan">
        <div className="tierlabel">② さらに精度を上げる</div>
        <ul>
          <li>正解ラベル付きの質問集を用意し、<b>recall / precision / nDCG</b> で定点観測する。</li>
          <li>本ツールは語彙ベース。実運用では<b>埋め込みベクトル＋この再ランキング</b>の2段構成が最も精度が出ます。</li>
          <li>ヒットゼロの質問ログは<b>ナレッジ不足の可視化</b>＝追加すべき文書のリストになります。</li>
        </ul>
      </div>
    </div>

    <p className="note">※スコアはブラウザ内で計算したBM25風の語彙適合度（実計算）です。同義語辞書は{Object.keys(SYN).length}語の簡易版で、外部LLMや埋め込みベクトルは使用していません。実運用では埋め込みモデルを併用します。</p>
  </div>);
}

function ActionBar(){
  const [msg,setMsg]=React.useState("");
  // 画面の内容をテキストとして取り出し、Excel等に貼れる形でコピーする
  const copyAll=function(){
    try{
      var root=document.getElementById("root");
      var out=[];
      root.querySelectorAll("h1,h2,h3,table,.metric,.verdict,.todo li,.chk").forEach(function(el){
        if(el.tagName==="TABLE"){
          el.querySelectorAll("tr").forEach(function(tr){
            var cells=[];
            tr.querySelectorAll("th,td").forEach(function(td){
              var inp=td.querySelector("input,select");
              cells.push(((inp?inp.value:td.textContent)||"").trim().replace(/\s+/g," "));
            });
            if(cells.join("").trim())out.push(cells.join("\t"));
          });
          out.push("");
        }else{
          var t=(el.textContent||"").trim().replace(/\s+/g," ");
          if(t)out.push(t);
        }
      });
      var text=out.join("\n");
      if(navigator.clipboard&&navigator.clipboard.writeText){
        navigator.clipboard.writeText(text).then(function(){setMsg("コピーしました（Excelやメールに貼れます）");},function(){fallback(text);});
      }else fallback(text);
      function fallback(t){
        var ta=document.createElement("textarea");ta.value=t;document.body.appendChild(ta);ta.select();
        try{document.execCommand("copy");setMsg("コピーしました");}catch(e){setMsg("コピーできませんでした");}
        document.body.removeChild(ta);
      }
      setTimeout(function(){setMsg("");},3000);
    }catch(e){setMsg("コピーできませんでした");}
  };
  return (<div className="noprint" style={{display:"flex",gap:8,alignItems:"center",flexWrap:"wrap",margin:"0 0 12px"}}>
    <button onClick={function(){window.print();}}
      style={{border:0,borderRadius:8,background:"#334155",color:"#fff",padding:"8px 14px",cursor:"pointer",fontSize:13}}>
      🖨 印刷 / PDFで保存</button>
    <button onClick={copyAll}
      style={{border:0,borderRadius:8,background:"#e2e8f0",color:"#334155",padding:"8px 14px",cursor:"pointer",fontSize:13}}>
      📋 結果をコピー（Excelに貼れます）</button>
    {msg && <span style={{fontSize:12.5,color:"#0f5c3f",fontWeight:"bold"}}>{msg}</span>}
  </div>);
}

  return (<div className="wrap" style={{margin:"24px auto 8px",fontSize:11.5,color:"#8a8f9c",lineHeight:1.9,
      borderTop:"1px solid #e0e6ec",paddingTop:12}}>
    <div><b style={{color:"#556"}}>提供</b>：株式会社デジタルアイデンティティ</div>
    <div><b style={{color:"#556"}}>データの取り扱い</b>：入力された内容は<b>お使いの端末の中だけ</b>に保存されます。当社のサーバーへ送信・保存されることはありません。端末を共有している場合は、画面上の「最初に戻す」で消去してください。</div>
    <div><b style={{color:"#556"}}>ご利用にあたって</b>：本ツールの計算結果は<b>判断の材料</b>であり、成果を保証するものではありません。最終的な意思決定はご自身の責任で行ってください。本ツールの利用により生じた損害について、当社は責任を負いかねます。</div>
    <div className="printonly">印刷日: {new Date().toLocaleDateString("ja-JP")}</div>
  </div>);
}
